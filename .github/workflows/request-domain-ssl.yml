name: Request custom domain certificate provisioning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-domain-ssl.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Safely reapply current GitHub Pages domain using GitHub REST API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Before:"
          gh api "repos/${{ github.repository }}/pages" --jq '{cname,https_enforced,build_type,status}' || true
          echo "Reapplying the current domain without removing it:"
          gh api -X PUT "repos/${{ github.repository }}/pages" -f cname='beauty.yorisuguri-note.com' -H "X-GitHub-Api-Version: 2026-03-10"
          status=$?
          echo "API exit code: $status"
          echo "After:"
          gh api "repos/${{ github.repository }}/pages" --jq '{cname,https_enforced,build_type,status}' || true
          exit "$status"
